<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier & Payment Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🪙</span>
                <h1 class="text-xl font-bold tracking-wide">Cashier & Payment Tracker</h1>
            </div>
            <div class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-medium">POS Terminal</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 md:p-6 grid lg:grid-cols-3 gap-6">
        
        <!-- Left 2 Cols: Catalog & Transactions -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Quick Catalog -->
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-sm">
                <h3 class="text-lg font-bold mb-4 text-slate-200">Quick Catalog</h3>
                <div class="grid sm:grid-cols-3 gap-4">
                    <button onclick="addItem('Coffee', 3.00)" class="p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl text-left transition">
                        <div class="text-2xl mb-1">☕</div>
                        <div class="font-bold">Coffee</div>
                        <div class="text-amber-400 font-semibold">$3.00</div>
                    </button>
                    <button onclick="addItem('Sandwich', 6.50)" class="p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl text-left transition">
                        <div class="text-2xl mb-1">🥪</div>
                        <div class="font-bold">Sandwich</div>
                        <div class="text-amber-400 font-semibold">$6.50</div>
                    </button>
                    <button onclick="addItem('Pastries', 2.50)" class="p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl text-left transition">
                        <div class="text-2xl mb-1">🥐</div>
                        <div class="font-bold">Pastries</div>
                        <div class="text-amber-400 font-semibold">$2.50</div>
                    </button>
                </div>
            </div>

            <!-- Transaction Log -->
            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-200">Transaction Ledger</h3>
                    <span id="tx-count" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-medium">0 Transactions</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400">
                                <th class="pb-2">Time</th>
                                <th class="pb-2">Items</th>
                                <th class="pb-2">Total</th>
                                <th class="pb-2">Method</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <tr>
                                <td colspan="4" class="py-4 text-center text-slate-500">No transactions recorded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Col: Cart & Checkout -->
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-sm flex flex-col justify-between space-y-6">
            <div>
                <h3 class="text-xl font-bold mb-4 text-slate-200">Active Order</h3>
                <div id="cart-items" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    <p class="text-slate-500 text-sm">Cart is empty. Tap catalog items to add.</p>
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4 space-y-4">
                <div class="flex justify-between items-center text-xl font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-amber-400">$0.00</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="checkout('Cash')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center space-x-1">
                        <span>💵 Cash</span>
                    </button>
                    <button onclick="checkout('Card (Swipe)')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center space-x-1">
                        <span>💳 Card</span>
                    </button>
                </div>
                <button onclick="checkout('NFC Tap')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">
                    📱 NFC Contactless Tap
                </button>
                <button onclick="clearCart()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 rounded-xl text-sm transition">Clear Cart</button>
            </div>
        </div>
    </main>

    <!-- App Logic -->
    <script>
        let cart = [];
        let transactions = [];

        function addItem(name, price) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">Cart is empty. Tap catalog items to add.</p>';
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `<div class="flex items-center justify-between bg-slate-700/50 p-3 rounded-xl border border-slate-600">
                    <div>
                        <div class="font-bold text-sm">${item.name}</div>
                        <div class="text-xs text-slate-400">$${item.price.toFixed(2)} x ${item.qty}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-amber-400">$${(item.price * item.qty).toFixed(2)}</span>
                        <button onclick="removeItem(${index})" class="text-red-400 font-bold px-2 py-1 text-xs bg-red-950/50 hover:bg-red-900 rounded">×</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            document.getElementById('cart-total').innerText = '$' + total.toFixed(2);
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            updateCartUI();
        }

        function checkout(method) {
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let summaryText = cart.map(i => `${i.qty}x ${i.name}`).join(', ');
            
            transactions.unshift({
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: summaryText,
                total: '$' + total.toFixed(2),
                method: method
            });

            cart = [];
            updateCartUI();
            updateTransactionsUI();
            alert(`Payment Successful via ${method}! Recorded in ledger.`);
        }

        function updateTransactionsUI() {
            const tbody = document.getElementById('transaction-list');
            document.getElementById('tx-count').innerText = transactions.length + ' Transactions';
            
            let html = '';
            transactions.forEach(tx => {
                html += `<tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
                    <td class="py-2.5 text-slate-400">${tx.time}</td>
                    <td class="py-2.5 font-medium">${tx.items}</td>
                    <td class="py-2.5 font-bold text-amber-400">${tx.total}</td>
                    <td class="py-2.5"><span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded-full font-semibold">${tx.method}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
