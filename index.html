<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier & Payment Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left 2 Cols: Catalog & Cart -->
        <div class="md:col-span-2 space-y-6">
            <!-- Product Catalog -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-slate-700">Quick Items</h2>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="addToCart('Coffee', 3.50)" class="p-3 bg-slate-50 hover:bg-blue-50 border rounded-lg text-left transition">
                        <div class="font-semibold">Coffee</div>
                        <div class="text-sm text-slate-500">$3.50</div>
                    </button>
                    <button onclick="addToCart('Sandwich', 8.00)" class="p-3 bg-slate-50 hover:bg-blue-50 border rounded-lg text-left transition">
                        <div class="font-semibold">Sandwich</div>
                        <div class="text-sm text-slate-500">$8.00</div>
                    </button>
                    <button onclick="addToCart('Pastry', 4.25)" class="p-3 bg-slate-50 hover:bg-blue-50 border rounded-lg text-left transition">
                        <div class="font-semibold">Pastry</div>
                        <div class="text-sm text-slate-500">$4.25</div>
                    </button>
                </div>
            </div>

            <!-- Current Cart -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between min-h-[300px]">
                <div>
                    <h2 class="text-lg font-bold mb-3 text-slate-700">Current Order</h2>
                    <div id="cart-items" class="divide-y max-h-48 overflow-y-auto mb-4">
                        <p class="text-slate-400 text-sm py-4 text-center">Cart is empty</p>
                    </div>
                </div>
                <div class="border-t pt-4">
                    <div class="flex justify-between text-xl font-bold mb-4">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>

                    <!-- Functional Payment Method Selector -->
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectPayment('Cash')" class="py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow transition">Cash</button>
                        <button onclick="selectPayment('Card')" class="py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition">Card (Swipe/Chip)</button>
                        <button onclick="selectPayment('NFC')" class="py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition">NFC (Tap)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Col: Payment Modal / Drawer Stats -->
        <div class="space-y-6">
            <!-- Drawer & Stats -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-slate-700">Register Drawer</h2>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between"><span>Cash in Drawer:</span> <span id="drawer-cash" class="font-bold">$150.00</span></div>
                    <div class="flex justify-between"><span>Card Sales:</span> <span id="drawer-card" class="font-bold">$0.00</span></div>
                    <div class="flex justify-between"><span>NFC Sales:</span> <span id="drawer-nfc" class="font-bold">$0.00</span></div>
                </div>
            </div>

            <!-- Active Payment Handler Panel -->
            <div id="payment-panel" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-slate-700">Payment Action</h2>
                <div id="payment-content" class="text-slate-400 text-sm py-6 text-center">
                    Select a payment method to proceed.
                </div>
            </div>

            <!-- Transaction Log -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-3 text-slate-700">Recent Transactions</h2>
                <div id="tx-log" class="space-y-2 text-xs max-h-40 overflow-y-auto">
                    <p class="text-slate-400">No transactions yet.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let cart = [];
        let drawer = { cash: 150.00, card: 0.00, nfc: 0.00 };
        let transactions = [];

        function addToCart(name, price) {
            let existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm py-4 text-center">Cart is empty</p>`;
                totalEl.textContent = '$0.00';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                html += `
                    py-2 flex justify-between items-center text-sm">
                        <span>${item.name} (x${item.qty})</span>
                        <div class="space-x-3">
                            <span class="font-semibold">$${subtotal.toFixed(2)}</span>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold">&times;</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function getCartTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function selectPayment(method) {
            let total = getCartTotal();
            if (total <= 0) {
                alert("Cart is empty!");
                return;
            }

            const panel = document.getElementById('payment-content');

            if (method === 'Cash') {
                panel.innerHTML = `
                    <div class="space-y-3">
                        <p class="font-medium">Total Due: <span class="text-emerald-600 font-bold">$${total.toFixed(2)}</span></p>
                        <label class="block text-xs text-slate-500">Cash Tendered:</label>
                        <input type="number" id="cash-given" class="w-full border rounded p-2 text-sm" placeholder="0.00">
                        <button onclick="processCashPayment(${total})" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold hover:bg-emerald-700">Complete Cash Payment</button>
                    </div>
                `;
            } else if (method === 'Card') {
                panel.innerHTML = `
                    <div class="space-y-3 text-center">
                        <p class="font-medium">Insert / Swipe Card for <span class="text-blue-600 font-bold">$${total.toFixed(2)}</span></p>
                        <div class="animate-pulse text-blue-500 font-semibold py-2">Reading Chip...</div>
                        <button onclick="completeDigitalPayment('Card', ${total})" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Simulate Approval</button>
                    </div>
                `;
            } else if (method === 'NFC') {
                panel.innerHTML = `
                    <div class="space-y-3 text-center">
                        <p class="font-medium">Tap Phone/Card for <span class="text-indigo-600 font-bold">$${total.toFixed(2)}</span></p>
                        <div class="animate-bounce text-indigo-500 font-semibold py-2">Waiting for Tap...</div>
                        <button onclick="completeDigitalPayment('NFC', ${total})" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-700">Simulate Tap Success</button>
                    </div>
                `;
            }
        }

        function processCashPayment(total) {
            let given = parseFloat(document.getElementById('cash-given').value);
            if (isNaN(given) || given < total) {
                alert("Insufficient cash tendered.");
                return;
            }
            let change = given - total;
            drawer.cash += total;
            
            recordTransaction('Cash', total);
            alert(`Payment successful! Change due: $${change.toFixed(2)}`);
            resetOrder();
        }

        function completeDigitalPayment(method, total) {
            if (method === 'Card') drawer.card += total;
            if (method === 'NFC') drawer.nfc += total;

            recordTransaction(method, total);
            alert(`${method} payment approved successfully!`);
            resetOrder();
        }

        function recordTransaction(method, amount) {
            transactions.unshift({ method, amount, time: new Date().toLocaleTimeString() });
            updateDrawerDisplay();
            updateLogDisplay();
        }

        function updateDrawerDisplay() {
            document.getElementById('drawer-cash').textContent = `$${drawer.cash.toFixed(2)}`;
            document.getElementById('drawer-card').textContent = `$${drawer.card.toFixed(2)}`;
            document.getElementById('drawer-nfc').textContent = `$${drawer.nfc.toFixed(2)}`;
        }

        function updateLogDisplay() {
            const logEl = document.getElementById('tx-log');
            let html = '';
            transactions.forEach(tx => {
                html += `<div class="flex justify-between border-b py-1"><span>[${tx.time}] ${tx.method}</span><span class="font-bold text-emerald-600">+$${tx.amount.toFixed(2)}</span></div>`;
            });
            logEl.innerHTML = html;
        }

        function resetOrder() {
            cart = [];
            renderCart();
            document.getElementById('payment-content').innerHTML = `Select a payment method to proceed.`;
        }
    </script>
</body>
</html>
